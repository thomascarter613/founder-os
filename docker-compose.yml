services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: founder-os-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-54322}:5432"
    environment:
      POSTGRES_DB: "${DATABASE_NAME:-postgres}"
      POSTGRES_USER: "${DATABASE_USER:-postgres}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
